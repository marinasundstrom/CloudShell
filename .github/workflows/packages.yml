name: Build and publish NuGet packages

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: Optional package version. Defaults to a CI prerelease version.
        required: false
        type: string
      publish_target:
        description: Destination for the verified packages.
        required: true
        default: artifact
        type: choice
        options:
          - artifact
          - myget
          - nuget.org
          - unlist-nuget-preview1

permissions:
  contents: read

jobs:
  pack:
    name: Pack and verify
    if: ${{ inputs.publish_target != 'unlist-nuget-preview1' }}
    runs-on: ubuntu-latest
    outputs:
      package-version: ${{ steps.version.outputs.package-version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Select package version
        id: version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          PUBLISH_TARGET: ${{ inputs.publish_target }}
        run: |
          set -euo pipefail

          if [[ ( "$PUBLISH_TARGET" == "myget" || "$PUBLISH_TARGET" == "nuget.org" ) && -z "$REQUESTED_VERSION" ]]; then
            echo "An explicit version is required when publishing." >&2
            exit 1
          fi

          version="${REQUESTED_VERSION:-0.1.0-ci.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid NuGet package version: $version" >&2
            exit 1
          fi

          if [[ "$PUBLISH_TARGET" == "myget" && ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-preview\.[0-9]+$ ]]; then
            echo "MyGet preview versions must use the form 0.1.0-preview.1." >&2
            exit 1
          fi

          if [[ "$PUBLISH_TARGET" == "nuget.org" && ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "NuGet.org releases must use a stable version such as 1.0.0." >&2
            exit 1
          fi

          if [[ "$PUBLISH_TARGET" == "artifact" && -n "$REQUESTED_VERSION" && ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-preview\.[0-9]+$ ]]; then
            echo "Requested artifact versions must use the form 0.1.0-preview.1." >&2
            exit 1
          fi

          echo "package-version=$version" >> "$GITHUB_OUTPUT"
          echo "Building CloudShell packages at version $version"

      - name: Restore package projects
        run: dotnet restore CloudShell.Packages.slnx

      - name: Build package projects
        run: >-
          dotnet build CloudShell.Packages.slnx
          --configuration Release
          --no-restore
          -p:Version=${{ steps.version.outputs.package-version }}
          -p:PackageVersion=${{ steps.version.outputs.package-version }}
          -p:ContinuousIntegrationBuild=true

      - name: Pack
        run: >-
          dotnet pack CloudShell.Packages.slnx
          --configuration Release
          --no-build
          --no-restore
          --output artifacts/packages
          --include-symbols
          -p:SymbolPackageFormat=snupkg
          -p:Version=${{ steps.version.outputs.package-version }}
          -p:PackageVersion=${{ steps.version.outputs.package-version }}
          -p:ContinuousIntegrationBuild=true

      - name: Verify package artifacts
        shell: bash
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.package-version }}
        run: |
          set -euo pipefail

          package_count=$(find artifacts/packages -maxdepth 1 -type f -name '*.nupkg' ! -name '*.snupkg' | wc -l | tr -d ' ')
          symbol_count=$(find artifacts/packages -maxdepth 1 -type f -name '*.snupkg' | wc -l | tr -d ' ')

          if [[ "$package_count" -ne 26 ]]; then
            echo "Expected 26 NuGet packages, found $package_count." >&2
            find artifacts/packages -maxdepth 1 -type f -print | sort
            exit 1
          fi

          if [[ "$symbol_count" -ne "$package_count" ]]; then
            echo "Expected one symbol package per NuGet package; found $symbol_count symbols for $package_count packages." >&2
            exit 1
          fi

          for package in artifacts/packages/*.nupkg; do
            manifest=$(unzip -p "$package" '*.nuspec')

            grep -Fq "<version>$PACKAGE_VERSION</version>" <<< "$manifest"
            grep -Fq '<authors>Marina Sundström</authors>' <<< "$manifest"
            grep -Fq '<description>' <<< "$manifest"
            grep -Fq '<license type="expression">MIT</license>' <<< "$manifest"
            grep -Fq '<projectUrl>https://github.com/marinasundstrom/CloudShell</projectUrl>' <<< "$manifest"
            grep -Fq '<readme>README.md</readme>' <<< "$manifest"
            grep -Fq '<repository type="git" url="https://github.com/marinasundstrom/CloudShell"' <<< "$manifest"
            grep -Fq ' commit="' <<< "$manifest"
            unzip -Z1 "$package" | grep -Fxq 'README.md'
          done

      - name: Verify clean consumer restore
        shell: bash
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.package-version }}
        run: |
          set -euo pipefail

          consumer_directory="$RUNNER_TEMP/cloudshell-package-consumer"
          local_source="$GITHUB_WORKSPACE/artifacts/packages"

          dotnet new classlib --name CloudShell.PackageConsumer --output "$consumer_directory" --framework net11.0
          dotnet add "$consumer_directory/CloudShell.PackageConsumer.csproj" package CloudShell.AppHost.Launcher --version "$PACKAGE_VERSION" --no-restore
          dotnet add "$consumer_directory/CloudShell.PackageConsumer.csproj" package CloudShell.AppHost --version "$PACKAGE_VERSION" --no-restore
          dotnet add "$consumer_directory/CloudShell.PackageConsumer.csproj" package CloudShell.ControlPlane.Providers.UI --version "$PACKAGE_VERSION" --no-restore
          dotnet add "$consumer_directory/CloudShell.PackageConsumer.csproj" package CloudShell.Providers.DockerCompose --version "$PACKAGE_VERSION" --no-restore
          dotnet add "$consumer_directory/CloudShell.PackageConsumer.csproj" package CloudShell.Providers.Traefik --version "$PACKAGE_VERSION" --no-restore
          dotnet add "$consumer_directory/CloudShell.PackageConsumer.csproj" package CloudShell.Configuration.Client --version "$PACKAGE_VERSION" --no-restore
          dotnet add "$consumer_directory/CloudShell.PackageConsumer.csproj" package CloudShell.Secrets.Client --version "$PACKAGE_VERSION" --no-restore
          dotnet add "$consumer_directory/CloudShell.PackageConsumer.csproj" package CloudShell.DeviceRegistry.Client --version "$PACKAGE_VERSION" --no-restore
          dotnet add "$consumer_directory/CloudShell.PackageConsumer.csproj" package CloudShell.EventBroker.Client --version "$PACKAGE_VERSION" --no-restore
          dotnet add "$consumer_directory/CloudShell.PackageConsumer.csproj" package CloudShell.RabbitMQ.Client --version "$PACKAGE_VERSION" --no-restore
          dotnet add "$consumer_directory/CloudShell.PackageConsumer.csproj" package CloudShell.SqlServer.Client --version "$PACKAGE_VERSION" --no-restore

          dotnet restore "$consumer_directory/CloudShell.PackageConsumer.csproj" \
            --source "$local_source" \
            --source https://api.nuget.org/v3/index.json
          dotnet build "$consumer_directory/CloudShell.PackageConsumer.csproj" --no-restore

      - name: Upload packages
        uses: actions/upload-artifact@v6
        with:
          name: cloudshell-nuget-${{ steps.version.outputs.package-version }}
          path: artifacts/packages/*.*nupkg
          if-no-files-found: error
          retention-days: 14

  publish-preview:
    name: Publish to MyGet preview feed
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_target == 'myget' }}
    needs: pack
    runs-on: ubuntu-latest
    concurrency:
      group: cloudshell-myget-preview-publish
      cancel-in-progress: false
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Download verified packages
        uses: actions/download-artifact@v5
        with:
          name: cloudshell-nuget-${{ needs.pack.outputs.package-version }}
          path: artifacts/packages

      - name: Publish packages
        shell: bash
        env:
          MYGET_API_KEY: ${{ secrets.MYGET_API_KEY }}
        run: |
          set -euo pipefail

          if [[ -z "$MYGET_API_KEY" ]]; then
            echo "The MYGET_API_KEY repository secret is not configured." >&2
            exit 1
          fi

          for package in artifacts/packages/*.nupkg; do
            dotnet nuget push "$package" \
              --api-key "$MYGET_API_KEY" \
              --source https://www.myget.org/F/cloudshell/api/v3/index.json \
              --skip-duplicate
          done

      - name: Verify restore from preview feed
        shell: bash
        env:
          PACKAGE_VERSION: ${{ needs.pack.outputs.package-version }}
        run: |
          set -euo pipefail

          consumer_directory="$RUNNER_TEMP/cloudshell-myget-consumer"
          consumer_project="$consumer_directory/CloudShell.MyGetConsumer.csproj"

          dotnet new classlib --name CloudShell.MyGetConsumer --output "$consumer_directory" --framework net11.0
          dotnet add "$consumer_project" package CloudShell.AppHost.Launcher --version "$PACKAGE_VERSION" --no-restore
          dotnet add "$consumer_project" package CloudShell.AppHost --version "$PACKAGE_VERSION" --no-restore
          dotnet add "$consumer_project" package CloudShell.ControlPlane.Providers.UI --version "$PACKAGE_VERSION" --no-restore
          dotnet add "$consumer_project" package CloudShell.Providers.DockerCompose --version "$PACKAGE_VERSION" --no-restore
          dotnet add "$consumer_project" package CloudShell.Providers.Traefik --version "$PACKAGE_VERSION" --no-restore
          dotnet add "$consumer_project" package CloudShell.Configuration.Client --version "$PACKAGE_VERSION" --no-restore
          dotnet add "$consumer_project" package CloudShell.Secrets.Client --version "$PACKAGE_VERSION" --no-restore
          dotnet add "$consumer_project" package CloudShell.DeviceRegistry.Client --version "$PACKAGE_VERSION" --no-restore
          dotnet add "$consumer_project" package CloudShell.EventBroker.Client --version "$PACKAGE_VERSION" --no-restore
          dotnet add "$consumer_project" package CloudShell.RabbitMQ.Client --version "$PACKAGE_VERSION" --no-restore
          dotnet add "$consumer_project" package CloudShell.SqlServer.Client --version "$PACKAGE_VERSION" --no-restore

          for attempt in {1..12}; do
            if dotnet restore "$consumer_project" \
              --no-cache \
              --force \
              --source https://www.myget.org/F/cloudshell/api/v3/index.json \
              --source https://api.nuget.org/v3/index.json; then
              break
            fi

            if [[ "$attempt" -eq 12 ]]; then
              echo "Packages were not restorable from MyGet after 12 attempts." >&2
              exit 1
            fi

            sleep 5
          done

          dotnet build "$consumer_project" --no-restore

  unlist-nuget-preview1:
    name: Unlist incomplete NuGet.org preview.1
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_target == 'unlist-nuget-preview1' }}
    runs-on: ubuntu-latest
    concurrency:
      group: cloudshell-nuget-publish
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write

    steps:
      - name: NuGet login
        id: login
        uses: NuGet/login@v1
        with:
          user: marna.li

      - name: Unlist published preview.1 packages
        shell: bash
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          set -euo pipefail

          package_ids=(
            CloudShell.Abstractions
            CloudShell.AppHost
            CloudShell.AppHost.Launcher
            CloudShell.Client
            CloudShell.Components
            CloudShell.Configuration
            CloudShell.Configuration.Client
            CloudShell.ControlPlane
            CloudShell.ControlPlane.Client
            CloudShell.ControlPlane.Providers
            CloudShell.ControlPlane.Providers.UI
            CloudShell.ControlPlane.ResourceModel
            CloudShell.DeviceRegistry.Client
            CloudShell.EventBroker.Client
            CloudShell.Hosting
            CloudShell.Persistence
            CloudShell.Providers.DockerCompose
            CloudShell.Providers.Traefik
            CloudShell.RabbitMQ.Client
            CloudShell.ResourceModel
            CloudShell.Secrets.Client
            CloudShell.SqlServer.Client
          )

          if [[ "${#package_ids[@]}" -ne 22 ]]; then
            echo "Expected exactly 22 package IDs to unlist." >&2
            exit 1
          fi

          for package_id in "${package_ids[@]}"; do
            dotnet nuget delete "$package_id" 0.1.0-preview.1 \
              --api-key "$NUGET_API_KEY" \
              --source https://api.nuget.org/v3/index.json \
              --non-interactive
          done

      - name: Verify packages are unlisted
        shell: bash
        run: |
          set -euo pipefail

          package_ids=(
            cloudshell.abstractions
            cloudshell.apphost
            cloudshell.apphost.launcher
            cloudshell.client
            cloudshell.components
            cloudshell.configuration
            cloudshell.configuration.client
            cloudshell.controlplane
            cloudshell.controlplane.client
            cloudshell.controlplane.providers
            cloudshell.controlplane.providers.ui
            cloudshell.controlplane.resourcemodel
            cloudshell.deviceregistry.client
            cloudshell.eventbroker.client
            cloudshell.hosting
            cloudshell.persistence
            cloudshell.providers.dockercompose
            cloudshell.providers.traefik
            cloudshell.rabbitmq.client
            cloudshell.resourcemodel
            cloudshell.secrets.client
            cloudshell.sqlserver.client
          )

          for attempt in {1..12}; do
            listed_count=0

            for package_id in "${package_ids[@]}"; do
              listed=$(curl --compressed -fsS \
                "https://api.nuget.org/v3/registration5-gz-semver2/$package_id/0.1.0-preview.1.json" \
                | jq -r '.listed')

              if [[ "$listed" != "false" ]]; then
                ((listed_count+=1))
              fi
            done

            if [[ "$listed_count" -eq 0 ]]; then
              echo "All 22 preview.1 package versions are unlisted."
              exit 0
            fi

            if [[ "$attempt" -eq 12 ]]; then
              echo "$listed_count package versions remain listed after 12 attempts." >&2
              exit 1
            fi

            sleep 5
          done

  publish-nuget:
    name: Publish to NuGet.org
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_target == 'nuget.org' }}
    needs: pack
    runs-on: ubuntu-latest
    concurrency:
      group: cloudshell-nuget-publish
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Download verified packages
        uses: actions/download-artifact@v5
        with:
          name: cloudshell-nuget-${{ needs.pack.outputs.package-version }}
          path: artifacts/packages

      - name: NuGet login
        id: login
        uses: NuGet/login@v1
        with:
          user: marna.li

      - name: Publish packages
        shell: bash
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          set -euo pipefail

          for package in artifacts/packages/*.nupkg; do
            dotnet nuget push "$package" \
              --api-key "$NUGET_API_KEY" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done

      - name: Verify restore from NuGet.org
        shell: bash
        env:
          PACKAGE_VERSION: ${{ needs.pack.outputs.package-version }}
        run: |
          set -euo pipefail

          consumer_directory="$RUNNER_TEMP/cloudshell-nuget-consumer"
          consumer_project="$consumer_directory/CloudShell.NuGetConsumer.csproj"

          dotnet new classlib --name CloudShell.NuGetConsumer --output "$consumer_directory" --framework net11.0
          dotnet add "$consumer_project" package CloudShell.AppHost.Launcher --version "$PACKAGE_VERSION" --no-restore
          dotnet add "$consumer_project" package CloudShell.AppHost --version "$PACKAGE_VERSION" --no-restore
          dotnet add "$consumer_project" package CloudShell.ControlPlane.Providers.UI --version "$PACKAGE_VERSION" --no-restore
          dotnet add "$consumer_project" package CloudShell.Providers.DockerCompose --version "$PACKAGE_VERSION" --no-restore
          dotnet add "$consumer_project" package CloudShell.Providers.Traefik --version "$PACKAGE_VERSION" --no-restore
          dotnet add "$consumer_project" package CloudShell.Configuration.Client --version "$PACKAGE_VERSION" --no-restore
          dotnet add "$consumer_project" package CloudShell.Secrets.Client --version "$PACKAGE_VERSION" --no-restore
          dotnet add "$consumer_project" package CloudShell.DeviceRegistry.Client --version "$PACKAGE_VERSION" --no-restore
          dotnet add "$consumer_project" package CloudShell.EventBroker.Client --version "$PACKAGE_VERSION" --no-restore
          dotnet add "$consumer_project" package CloudShell.RabbitMQ.Client --version "$PACKAGE_VERSION" --no-restore
          dotnet add "$consumer_project" package CloudShell.SqlServer.Client --version "$PACKAGE_VERSION" --no-restore

          for attempt in {1..12}; do
            if dotnet restore "$consumer_project" \
              --no-cache \
              --force \
              --source https://api.nuget.org/v3/index.json; then
              break
            fi

            if [[ "$attempt" -eq 12 ]]; then
              echo "Packages were not restorable from NuGet.org after 12 attempts." >&2
              exit 1
            fi

            sleep 5
          done

          dotnet build "$consumer_project" --no-restore
