name: cloudshell-third-party-identity

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.2
    entrypoint: ["/bin/bash", "/opt/keycloak/bin/cloudshell-dev-start.sh"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-8080}:8080"
    volumes:
      - ./start-keycloak-dev.sh:/opt/keycloak/bin/cloudshell-dev-start.sh:ro
      - ./keycloak-realm.json:/opt/keycloak/data/import/cloudshell-realm.json:ro
